name: Daily TW Stock Sector Tracker

on:
  schedule:
    # GitHub Actions 的 cron 一律使用 UTC。
    # 台灣時間 (UTC+8) 15:30 = UTC 07:30，週一至週五。
    # 註：排程高峰時 GitHub 可能延遲數分鐘到十幾分鐘才開跑，屬正常現象。
    - cron: "30 7 * * 1-5"
  # 允許在 GitHub 網頁上手動觸發（測試用）
  workflow_dispatch:

# 需要寫入權限才能 commit 回儲存庫
permissions:
  contents: write

# 避免前一次尚未跑完又觸發下一次，造成 push 衝突
concurrency:
  group: daily-tw-stock
  cancel-in-progress: false

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"   # 依 requirements.txt 快取套件，加快執行速度

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tracker
        run: python tw_sector_tracker.py

      - name: Commit and push new data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/

          # 沒有變更（例如國定假日休市，抓到的仍是上一個交易日資料）就不 commit
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update TW stock data $(TZ=Asia/Taipei date +'%Y-%m-%d')"
          # 先 rebase 再 push，降低與其他推送衝突的機率
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
