name: Daily TW Stock Sector Tracker

on:
  schedule:
    # GitHub Actions 的 cron 一律使用 UTC（台灣時間 = UTC+8），週一至週五。
    # 避開整點／半點（GitHub 在這些時段排程最容易被延遲）
    - cron: "47 7 * * 1-5"    # 台灣時間 15:47（證交所、櫃買中心資料通常已更新）
    - cron: "43 10 * * 1-5"   # 台灣時間 18:43（補跑：官方資料較晚更新，或上市／上櫃日期不一致被略過時重試）
  # 允許在 GitHub 網頁上手動觸發（測試用）
  workflow_dispatch:

permissions:
  contents: write   # 把資料 commit 回儲存庫
  pages: write      # 請求 GitHub Pages 重新建置網頁

# 避免前一次尚未跑完又觸發下一次，造成 push 衝突
concurrency:
  group: daily-tw-stock
  cancel-in-progress: false

jobs:
  run-tracker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tracker
        run: python tw_sector_tracker.py

      - name: Commit and push new data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/

          # 沒有變更（例如國定假日休市）就不 commit
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update TW stock data $(TZ=Asia/Taipei date +'%Y-%m-%d')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # 重要：用 GITHUB_TOKEN 推送的 commit 不會自動觸發 GitHub Pages 重新建置，
      # 網頁會一直停在舊資料，所以這裡明確請求一次建置（無論本次有沒有新 commit）。
      - name: Trigger GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
