name: Daily TW Stock Sector Tracker

on:
  schedule:
    # GitHub Actions 的 cron 一律使用 UTC（台灣時間 = UTC+8），週一至週五。
    # GitHub 的排程常被延遲數小時（本 repo 曾延遲約 7 小時），所以在收盤後排多次。
    # 腳本可重複執行：資料沒變就不 commit，多跑幾次只是多一個保險。
    - cron: "47 7 * * 1-5"    # 台灣時間 15:47
    - cron: "53 8 * * 1-5"    # 台灣時間 16:53
    - cron: "43 9 * * 1-5"    # 台灣時間 17:43
    - cron: "43 10 * * 1-5"   # 台灣時間 18:43
    - cron: "13 12 * * 1-5"   # 台灣時間 20:13
    - cron: "13 0 * * 2-6"    # 台灣時間隔日 08:13（證交所 OpenAPI 較晚更新時，用官方資料覆蓋 yfinance 暫代值）
  # 允許在 GitHub 網頁上手動觸發（測試用）
  workflow_dispatch:

permissions:
  contents: write   # 把資料 commit 回儲存庫
  pages: write      # 請求 GitHub Pages 重新建置網頁

# 避免前一次尚未跑完又觸發下一次，造成 push 衝突
concurrency:
  group: daily-tw-stock
  cancel-in-progress: false

jobs:
  run-tracker:
    runs-on: ubuntu-24.04
    timeout-minutes: 25   # 籌碼資料第一次回補歷史會多花幾分鐘

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tracker
        run: python tw_sector_tracker.py

      - name: Commit and push new data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/

          # 沒有變更（例如國定假日休市）就不 commit
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update TW stock data $(TZ=Asia/Taipei date +'%Y-%m-%d')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # 重要：用 GITHUB_TOKEN 推送的 commit 不會自動觸發 GitHub Pages 重新建置，
      # 網頁會一直停在舊資料，所以這裡明確請求一次建置（無論本次有沒有新 commit）。
      - name: Trigger GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
