<!DOCTYPE html>
<html lang="zh-Hant" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>台股族群資金流向儀表板</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  body{background:#0b1220}
  .num{font-variant-numeric:tabular-nums}
  th.sortable{cursor:pointer;user-select:none}
  .sticky-col{position:sticky;left:0;background:#0f172a;z-index:1}
  tr.hl td{background:rgba(14,165,233,.18)}
  tr.hl td.sticky-col{background:#0b3a56}
</style>
</head>
<body class="text-slate-200 min-h-screen">
<div class="max-w-6xl mx-auto px-3 sm:px-6 py-4 space-y-4">

  <!-- 標題與資料來源 -->
  <header class="flex flex-wrap items-center justify-between gap-2">
    <div>
      <h1 class="text-lg sm:text-2xl font-bold">台股族群資金流向</h1>
      <p class="text-xs text-slate-400">資料日期：<span id="date" class="num">-</span>
        <span id="badge" class="ml-2 px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 hidden">示範資料</span></p>
    </div>
    <div class="flex gap-2">
      <label class="px-3 py-1.5 text-sm rounded-lg bg-sky-600 hover:bg-sky-500 cursor-pointer">
        匯入 CSV/JSON
        <input id="file" type="file" accept=".csv,.json" multiple class="hidden">
      </label>
      <button id="toggleUrl" class="px-3 py-1.5 text-sm rounded-lg bg-slate-700 hover:bg-slate-600">網址載入</button>
    </div>
  </header>

  <!-- 搜尋：輸入股票代號（或名稱），自動跳到該股所屬概念股清單 -->
  <div>
    <input id="q" list="stockList" inputmode="search" autocomplete="off" enterkeyhint="search"
      placeholder="🔍 輸入股票代號，自動跳到概念股頁面（例如 2330）"
      class="w-full bg-slate-800 rounded-xl px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-sky-500">
    <datalist id="stockList"></datalist>
    <p id="qMsg" class="hidden mt-1 text-sm text-amber-300"></p>
  </div>

  <div id="urlBox" class="hidden bg-slate-800/60 rounded-xl p-3 space-y-2">
    <p class="text-xs text-slate-400">貼上 CSV 或 JSON 網址（可多個，以空白或換行分隔；個股 CSV 與族群 CSV 可一起載入）</p>
    <textarea id="urls" rows="2" class="w-full bg-slate-900 rounded-lg p-2 text-sm outline-none" placeholder="https://raw.githubusercontent.com/.../output/stocks_2026-10-06.csv"></textarea>
    <button id="loadUrl" class="px-3 py-1.5 text-sm rounded-lg bg-sky-600 hover:bg-sky-500">載入</button>
  </div>
  <p id="msg" class="text-sm text-amber-300 hidden"></p>

  <!-- 分頁與設定 -->
  <div class="flex flex-wrap items-center justify-between gap-2">
    <div class="inline-flex rounded-lg bg-slate-800 p-1 text-sm">
      <button data-view="overview" class="tab px-4 py-1.5 rounded-md">族群總覽</button>
      <button data-view="stocks" class="tab px-4 py-1.5 rounded-md">個股明細</button>
    </div>
    <div class="inline-flex rounded-lg bg-slate-800 p-1 text-xs items-center">
      <span class="px-2 text-slate-400">當日漲幅</span>
      <button data-w="0" class="wbtn px-3 py-1 rounded-md">平均</button>
      <button data-w="1" class="wbtn px-3 py-1 rounded-md">加權</button>
    </div>
  </div>

  <!-- 族群總覽 -->
  <section id="overview" class="space-y-4">
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-slate-800/60 rounded-xl p-3">
        <h2 class="text-sm font-semibold mb-1">族群資金佔比</h2>
        <p class="text-[11px] text-slate-500 mb-2">個股可屬多個族群，佔比加總可能超過 100%；圓環為相對比例。</p>
        <div id="pieWrap" class="relative h-72"><canvas id="pie"></canvas></div>
      </div>
      <div class="bg-slate-800/60 rounded-xl p-3">
        <h2 class="text-sm font-semibold mb-1">當日漲幅 vs 5 日漲幅</h2>
        <p class="text-[11px] text-slate-500 mb-2">深色＝當日、淺色＋外框＝5 日；紅漲綠跌。</p>
        <div id="barWrap" class="relative h-72"><canvas id="bar"></canvas></div>
      </div>
    </div>
    <div id="cards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3"></div>
  </section>

  <!-- 個股明細 -->
  <section id="stocks" class="space-y-3 hidden">
    <div id="hit" class="hidden flex flex-wrap items-center gap-2 rounded-xl bg-sky-500/10 px-3 py-2 text-sm"></div>
    <div id="chips" class="flex gap-2 overflow-x-auto pb-1"></div>
    <div class="flex flex-wrap items-center gap-2 text-xs text-slate-400">
      <label for="chartSel">點名稱開啟 K 線圖：</label>
      <select id="chartSel" class="bg-slate-800 rounded-md px-2 py-1 text-slate-200 outline-none"></select>
      <span class="text-slate-500">（打不開或沒有圖時，換一個網站試試）</span>
    </div>
    <p id="allNote" class="text-[11px] text-slate-500">「全部」檢視中，同一檔股票會依所屬族群各列一次（各族群的產業分類與說明不同）。</p>
    <div class="bg-slate-800/60 rounded-xl overflow-x-auto">
      <table class="w-full min-w-[980px] text-sm">
        <thead class="text-slate-400 text-xs">
          <tr id="thead"></tr>
        </thead>
        <tbody id="tbody" class="divide-y divide-slate-700/50"></tbody>
      </table>
    </div>
  </section>

  <footer class="text-[11px] text-slate-500 pb-6">成交金額為收盤價 × 成交股數之近似值，單位：億元。僅供參考，非投資建議。</footer>
</div>

<script>
/* ===== 設定 =====
 * 預設載入的資料網址（相對於 index.html）。載入失敗時自動使用下方示範資料。
 * 若 Python 腳本另存一份固定檔名（如 stocks_latest.csv），就能每天自動更新。 */
const CONFIG = {
  DEFAULT_URLS: ["output/stocks_latest.csv", "output/sectors_latest.csv"],
  CHART_SITE: "goodinfo"   // 預設的 K 線圖網站；也可在「個股明細」頁用下拉選單切換（會記住選擇）
};
/* 點個股名稱開啟的 K 線圖網站（皆以台股代號查詢，上市／上櫃通用） */
const CHART_SITES = {
  goodinfo:  { label: "Goodinfo 台灣股市資訊網", url: c => `https://goodinfo.tw/tw/ShowK_Chart.asp?STOCK_ID=${c}` },
  wantgoo:   { label: "玩股網 WantGoo",           url: c => `https://www.wantgoo.com/stock/${c}/technical-chart` },
  moneylink: { label: "MoneyLink 鉅亨",           url: c => `https://ww2.money-link.com.tw/TWStock/StockTA.aspx?SymId=${c}` }
};
const chartUrl = c => CHART_SITES[S.chartSite].url(encodeURIComponent(c));

/* ===== JSON 資料結構（與 Python 產出欄位一一對應）=====
 * {
 *   "date": "2026-10-06",
 *   "stocks": [{ code, name, segment, desc, close, pct1d, pct5d, turnoverYi, sectors: ["族群A", ...] }],  // segment=產業分類, desc=說明
 *   "sectors": [{ name, count, avg1d, wavg1d, avg5d, turnoverYi, share }]   // 選填；缺少時由個股自動計算
 * }
 * CSV 欄位：stocks_*.csv → 族群,代號,名稱,產業分類,說明,日期,收盤價,當日漲跌幅(%),近5日漲跌幅(%),成交金額(億),成交金額(元)
 *          （每檔個股依所屬族群各列一次；舊格式「所屬族群」欄位仍可讀取）
 * 點個股名稱會開啟 K 線圖（網站可用「個股明細」頁的下拉選單切換）。
 *          sectors_*.csv → 族群,有效檔數,設定檔數,當日平均漲幅(%),當日加權漲幅(%),近5日平均漲幅(%),成交金額(億),資金占比(%) */
const SAMPLE = { date: "示範", stocks: [
  {code:"2330",name:"台積電",close:1050,pct1d:1.25,pct5d:3.10,turnoverYi:520.3,sectors:["半導體"]},
  {code:"2454",name:"聯發科",close:1520,pct1d:-0.65,pct5d:1.20,turnoverYi:88.4,sectors:["半導體"]},
  {code:"3711",name:"日月光投控",close:168,pct1d:0.90,pct5d:2.40,turnoverYi:40.2,sectors:["半導體"]},
  {code:"2383",name:"台光電",close:2150,pct1d:3.40,pct5d:8.20,turnoverYi:95.6,sectors:["銅箔基板概念股","PCB概念股"]},
  {code:"6213",name:"聯茂",close:148,pct1d:2.10,pct5d:5.50,turnoverYi:22.3,sectors:["銅箔基板概念股"]},
  {code:"6274",name:"台燿",close:560,pct1d:1.60,pct5d:4.10,turnoverYi:30.8,sectors:["銅箔基板概念股"]},
  {code:"3081",name:"聯亞",close:520,pct1d:-1.80,pct5d:-3.20,turnoverYi:18.7,sectors:["光通訊概念股"]},
  {code:"4979",name:"華星光",close:410,pct1d:-2.40,pct5d:-1.50,turnoverYi:25.1,sectors:["光通訊概念股"]},
  {code:"1802",name:"台玻",close:24.5,pct1d:0.40,pct5d:-0.80,turnoverYi:6.2,sectors:["玻璃基板概念股"]},
  {code:"3189",name:"景碩",close:165,pct1d:1.10,pct5d:2.90,turnoverYi:9.8,sectors:["玻璃基板概念股","PCB概念股"]},
  {code:"3037",name:"欣興",close:190,pct1d:0.80,pct5d:1.70,turnoverYi:35.4,sectors:["PCB概念股"]},
  {code:"2368",name:"金像電",close:420,pct1d:-0.30,pct5d:0.60,turnoverYi:28.9,sectors:["PCB概念股"]}
]};

/* ===== 狀態 ===== */
let savedSite = null;
try { savedSite = localStorage.getItem("chartSite"); } catch (e) {}
const S = { data:null, sample:false, view:"overview", filter:null, weighted:false, highlight:null, scrollToHit:false, listFor:null, sort:{key:"pct1d",dir:-1},
  chartSite: CHART_SITES[savedSite] ? savedSite : CONFIG.CHART_SITE };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ===== 格式化（紅漲綠跌）===== */
const pct = v => (v > 0 ? "+" : "") + v.toFixed(2) + "%";
const yi = v => v.toLocaleString("zh-TW", {minimumFractionDigits:2, maximumFractionDigits:2}) + " 億";
const col = v => v > 0 ? "text-red-400" : v < 0 ? "text-green-400" : "text-slate-400";
const RED = a => `rgba(239,68,68,${a})`, GREEN = a => `rgba(34,197,94,${a})`;

/* ===== CSV 解析（支援 BOM、引號）===== */
function parseCSV(text) {
  text = text.replace(/^\uFEFF/, "");
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i+1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  const [h, ...body] = rows.filter(r => r.some(x => x.trim() !== ""));
  return h ? body.map(r => Object.fromEntries(h.map((k, i) => [k.trim(), (r[i] ?? "").trim()]))) : [];
}

/* ===== 欄位正規化 ===== */
const num = v => parseFloat(String(v).replace(/,/g, "")) || 0;
const findKey = (o, re) => Object.keys(o).find(k => re.test(k));
function normStock(r) {
  const k5 = findKey(r, /^近\d+日漲跌幅/);
  const secs = r["族群"] ? [r["族群"]] : (r["所屬族群"] || "").split(/[、,]/).map(s => s.trim()).filter(Boolean);
  return { code: r["代號"], name: r["名稱"], date: r["日期"], close: num(r["收盤價"]),
    segment: r["產業分類"] || "", desc: r["說明"] || "",
    pct1d: num(r["當日漲跌幅(%)"]), pct5d: num(r[k5]),
    turnoverYi: r["成交金額(億)"] !== undefined ? num(r["成交金額(億)"]) : num(r["成交金額(元)"]) / 1e8,
    sectors: secs };
}
function normSector(r) {
  const k5 = findKey(r, /^近\d+日平均漲幅/);
  return { name: r["族群"], count: num(r["有效檔數"]), avg1d: num(r["當日平均漲幅(%)"]),
    wavg1d: num(r["當日加權漲幅(%)"]), avg5d: num(r[k5]), turnoverYi: num(r["成交金額(億)"]), share: num(r["資金占比(%)"]) };
}

/* 若沒有族群檔，直接由個股計算（邏輯同 Python 腳本）*/
function computeSectors(stocks) {
  const uniq = {}; stocks.forEach(s => uniq[s.code] = s.turnoverYi);
  const total = Object.values(uniq).reduce((a, b) => a + b, 0) || 1;
  const m = {};
  stocks.forEach(s => s.sectors.forEach(n => (m[n] ||= []).push(s)));
  return Object.entries(m).map(([name, g]) => {
    const t = g.reduce((a, s) => a + s.turnoverYi, 0);
    return { name, count: g.length,
      avg1d: g.reduce((a, s) => a + s.pct1d, 0) / g.length,
      wavg1d: t > 0 ? g.reduce((a, s) => a + s.pct1d * s.turnoverYi, 0) / t : 0,
      avg5d: g.reduce((a, s) => a + s.pct5d, 0) / g.length,
      turnoverYi: t, share: t / total * 100 };
  });
}

/* ===== 載入資料 ===== */
function ingest(texts) {
  let stocks = null, sectors = null, date = null;
  for (const t0 of texts) {
    const t = t0.trim();
    if (t.startsWith("{")) { const j = JSON.parse(t); stocks = j.stocks; sectors = j.sectors; date = j.date; continue; }
    const rows = parseCSV(t); if (!rows.length) continue;
    if ("代號" in rows[0]) stocks = rows.map(normStock);
    else if ("族群" in rows[0]) sectors = rows.map(normSector);
  }
  if (!stocks || !stocks.length) throw new Error("找不到個股資料（CSV 需含「代號」欄位）");
  S.data = { date: date || stocks[0].date || "-", stocks, sectors: sectors && sectors.length ? sectors : computeSectors(stocks) };
  S.sample = false; S.filter = null;
}
async function fetchTexts(urls) {
  return Promise.all(urls.map(async u => { const r = await fetch(u, {cache:"no-store"}); if (!r.ok) throw new Error(u + " → " + r.status); return r.text(); }));
}
function showMsg(t) { $("msg").textContent = t; $("msg").classList.toggle("hidden", !t); }

/* ===== 繪圖 ===== */
Chart.defaults.color = "#94a3b8"; Chart.defaults.borderColor = "rgba(148,163,184,.15)";
const PAL = ["#38bdf8","#a78bfa","#fbbf24","#2dd4bf","#f472b6","#818cf8","#fb923c","#a3e635","#22d3ee","#e879f9","#facc15","#34d399","#60a5fa","#c084fc","#f9a8d4","#5eead4","#fdba74","#bef264"];
let pieC, barC;
const v1 = s => S.weighted ? s.wavg1d : s.avg1d;

function renderCharts() {
  const sec = [...S.data.sectors].sort((a, b) => b.turnoverYi - a.turnoverYi);
  $("pieWrap").style.height = (300 + Math.ceil(sec.length / 2) * 22) + "px";
  pieC?.destroy();
  pieC = new Chart($("pie"), { type:"doughnut",
    data:{ labels: sec.map(s => s.name), datasets:[{ data: sec.map(s => s.share), backgroundColor: sec.map((_, i) => PAL[i % PAL.length]), borderWidth:0 }] },
    options:{ responsive:true, maintainAspectRatio:false, cutout:"58%",
      plugins:{ legend:{ position:"bottom", labels:{ boxWidth:10, font:{size:11} } },
        tooltip:{ callbacks:{ label: c => ` ${c.label}: ${c.parsed.toFixed(2)}%（${yi(sec[c.dataIndex].turnoverYi)}）` } } },
      onClick:(e, els) => { if (els.length) pick(sec[els[0].index].name); } } });

  const bs = [...S.data.sectors].sort((a, b) => v1(b) - v1(a));
  $("barWrap").style.height = Math.max(288, bs.length * 40 + 80) + "px";
  const colorOf = a => c => (c.raw >= 0 ? RED(a) : GREEN(a));
  barC?.destroy();
  barC = new Chart($("bar"), { type:"bar",
    data:{ labels: bs.map(s => s.name), datasets:[
      { label:"當日", data: bs.map(v1), backgroundColor: colorOf(1), borderRadius:3 },
      { label:"5日", data: bs.map(s => s.avg5d), backgroundColor: colorOf(.4), borderColor: c => c.raw >= 0 ? RED(1) : GREEN(1), borderWidth:1, borderRadius:3 } ] },
    options:{ indexAxis:"y", responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ display:false }, tooltip:{ callbacks:{ label: c => ` ${c.dataset.label}：${pct(c.raw)}` } } },
      scales:{ x:{ ticks:{ callback: v => v + "%" } } },
      onClick:(e, els) => { if (els.length) pick(bs[els[0].index].name); } } });
}

/* ===== 渲染 ===== */
function renderCards() {
  const list = [...S.data.sectors].sort((a, b) => v1(b) - v1(a));
  const max = Math.max(...list.map(s => s.share), 1);
  $("cards").innerHTML = list.map(s => `
    <button data-sector="${esc(s.name)}" class="card text-left rounded-xl p-4 bg-slate-800/60 hover:bg-slate-700/60 border ${S.filter === s.name ? "border-sky-400" : "border-transparent"} transition">
      <div class="flex items-start justify-between">
        <div><div class="font-semibold">${esc(s.name)}</div><div class="text-xs text-slate-500">${s.count} 檔</div></div>
        <div class="num text-xl font-bold ${col(v1(s))}">${pct(v1(s))}</div>
      </div>
      <div class="mt-3 grid grid-cols-2 gap-2 text-xs">
        <div><div class="text-slate-500">5 日漲幅</div><div class="num ${col(s.avg5d)}">${pct(s.avg5d)}</div></div>
        <div><div class="text-slate-500">成交金額</div><div class="num">${yi(s.turnoverYi)}</div></div>
      </div>
      <div class="mt-3"><div class="flex justify-between text-xs text-slate-500"><span>資金佔比</span><span class="num text-slate-300">${s.share.toFixed(2)}%</span></div>
        <div class="h-1.5 bg-slate-700 rounded mt-1"><div class="h-1.5 bg-sky-400 rounded" style="width:${Math.min(100, s.share / max * 100)}%"></div></div></div>
    </button>`).join("");
}

const COLS = [["name","代號／名稱"],["segment","產業分類"],["desc","說明"],["close","收盤價"],["pct1d","當日漲跌"],["pct5d","5日漲跌"],["turnoverYi","成交金額"],["sectors","族群"]];
const LEFT = ["name","segment","desc","sectors"];
function renderStocks() {
  const hitRows = S.highlight ? S.data.stocks.filter(s => s.code === S.highlight) : [];
  if (hitRows.length) {
    const secs = [...new Set(hitRows.flatMap(s => s.sectors))];
    $("hit").innerHTML = `<span class="font-semibold">${esc(hitRows[0].name)}（${esc(S.highlight)}）</span><span class="text-slate-400">屬於 ${secs.length} 個族群：</span>`
      + secs.map(n => `<button data-chip="${esc(n)}" class="px-2.5 py-0.5 rounded-full text-xs ${S.filter === n ? "bg-sky-600" : "bg-slate-700 hover:bg-slate-600"}">${esc(n)}</button>`).join("")
      + `<button data-clear="1" class="ml-auto px-2 text-slate-400 hover:text-slate-200" title="清除搜尋">✕</button>`;
    $("hit").classList.remove("hidden");
  } else $("hit").classList.add("hidden");
  const names = S.data.sectors.map(s => s.name);
  $("chips").innerHTML = [null, ...names].map(n => `<button data-chip="${n === null ? "" : esc(n)}" class="chip shrink-0 px-3 py-1 rounded-full text-sm ${S.filter === n ? "bg-sky-600" : "bg-slate-800 hover:bg-slate-700"}">${n === null ? "全部" : esc(n)}</button>`).join("");
  $("allNote").classList.toggle("hidden", !!S.filter);
  $("thead").innerHTML = COLS.map(([k, t], i) => `<th data-sort="${k}" class="sortable ${i === 0 ? "sticky-col text-left" : LEFT.includes(k) ? "text-left" : "text-right"} px-3 py-2 font-medium whitespace-nowrap">${t}${S.sort.key === k ? (S.sort.dir > 0 ? " ▲" : " ▼") : ""}</th>`).join("");
  const {key, dir} = S.sort;
  const rows = S.data.stocks.filter(s => !S.filter || s.sectors.includes(S.filter))
    .sort((a, b) => {
      const x = key === "sectors" ? a.sectors.join() : a[key === "name" ? "code" : key];
      const y = key === "sectors" ? b.sectors.join() : b[key === "name" ? "code" : key];
      return (x > y ? 1 : x < y ? -1 : 0) * dir;
    });
  $("tbody").innerHTML = rows.map(s => `<tr class="hover:bg-slate-700/30${s.code === S.highlight ? " hl" : ""}">
    <td class="sticky-col px-3 py-2 whitespace-nowrap"><span class="num text-slate-400">${esc(s.code)}</span> <a href="${chartUrl(s.code)}" target="_blank" rel="noopener noreferrer" title="開啟 ${esc(s.name)} K 線圖" class="font-medium text-sky-300 hover:underline">${esc(s.name)}</a></td>
    <td class="px-3 py-2 whitespace-nowrap text-sky-300">${esc(s.segment || "-")}</td>
    <td class="px-3 py-2 text-xs text-slate-300 min-w-[11rem]">${esc(s.desc || "-")}</td>
    <td class="num text-right px-3 py-2">${s.close.toFixed(2)}</td>
    <td class="num text-right px-3 py-2 ${col(s.pct1d)}">${pct(s.pct1d)}</td>
    <td class="num text-right px-3 py-2 ${col(s.pct5d)}">${pct(s.pct5d)}</td>
    <td class="num text-right px-3 py-2 whitespace-nowrap">${yi(s.turnoverYi)}</td>
    <td class="text-left px-3 py-2 text-xs text-slate-400 whitespace-nowrap">${s.sectors.map(esc).join("、")}</td></tr>`).join("")
    || `<tr><td colspan="8" class="px-3 py-6 text-center text-slate-500">沒有資料</td></tr>`;
}

function render() {
  $("date").textContent = S.data.date;
  $("badge").classList.toggle("hidden", !S.sample);
  document.querySelectorAll(".tab").forEach(b => b.className = "tab px-4 py-1.5 rounded-md " + (b.dataset.view === S.view ? "bg-sky-600" : "text-slate-300"));
  document.querySelectorAll(".wbtn").forEach(b => b.className = "wbtn px-3 py-1 rounded-md " + ((b.dataset.w === "1") === S.weighted ? "bg-sky-600" : "text-slate-300"));
  $("overview").classList.toggle("hidden", S.view !== "overview");
  $("stocks").classList.toggle("hidden", S.view !== "stocks");
  renderCards(); renderStocks(); renderCharts();
  if (S.listFor !== S.data) {   // 資料更新時重建「代號＋名稱」建議清單
    const seen = new Map(); S.data.stocks.forEach(x => seen.set(x.code, x.name));
    $("stockList").innerHTML = [...seen].map(([c, n]) => `<option value="${esc(c)} ${esc(n)}">`).join("");
    S.listFor = S.data;
  }
  if (S.scrollToHit) {
    S.scrollToHit = false;
    document.querySelector("tr.hl")?.scrollIntoView({ block:"center", behavior:"smooth" });
  }
}
function pick(name) { S.filter = name || null; S.highlight = null; $("q").value = ""; S.view = "stocks"; render(); window.scrollTo({top:0, behavior:"smooth"}); }

/* ===== 事件 ===== */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-view],[data-w],[data-sector],[data-chip],[data-sort],[data-clear]"); if (!t) return;
  if (t.dataset.view) { S.view = t.dataset.view; render(); }
  else if (t.dataset.w) { S.weighted = t.dataset.w === "1"; render(); }
  else if (t.dataset.sector) pick(t.dataset.sector);
  else if (t.dataset.chip !== undefined) { S.filter = t.dataset.chip || null; S.scrollToHit = !!S.highlight; render(); }
  else if (t.dataset.clear) { S.highlight = null; $("q").value = ""; render(); }
  else if (t.dataset.sort) { const k = t.dataset.sort; S.sort = { key:k, dir: S.sort.key === k ? -S.sort.dir : -1 }; renderStocks(); }
});
$("toggleUrl").onclick = () => $("urlBox").classList.toggle("hidden");
$("file").onchange = async e => {
  try { ingest(await Promise.all([...e.target.files].map(f => f.text()))); showMsg(""); render(); }
  catch (err) { showMsg("匯入失敗：" + err.message); }
  e.target.value = "";
};
$("loadUrl").onclick = async () => {
  const urls = $("urls").value.split(/[\s,]+/).filter(Boolean); if (!urls.length) return;
  try { ingest(await fetchTexts(urls)); showMsg(""); render(); }
  catch (err) { showMsg("載入失敗：" + err.message + "（若為跨網域請求，來源需允許 CORS）"); }
};

/* ===== 搜尋：代號（4～6 碼）或名稱 → 跳到所屬概念股清單並標示該股 ===== */
function findStocks(v) {
  const m = v.match(/^(\d{4,6})/);
  if (m) return S.data.stocks.filter(x => x.code === m[1]);
  const q = v.toLowerCase();
  const exact = S.data.stocks.filter(x => x.name.toLowerCase() === q);
  if (exact.length) return exact;
  const part = S.data.stocks.filter(x => x.name.toLowerCase().includes(q));
  return new Set(part.map(x => x.code)).size === 1 ? part : [];   // 名稱片段僅在唯一符合時才自動跳轉
}
function goStock(v, final) {
  v = v.trim();
  $("qMsg").classList.add("hidden");
  if (!v || !S.data) return;
  const hit = findStocks(v);
  if (!hit.length) {
    if (final || /^\d{4,6}$/.test(v)) { $("qMsg").textContent = `找不到「${v}」，可能不在追蹤清單內`; $("qMsg").classList.remove("hidden"); }
    return;
  }
  const secs = [...new Set(hit.flatMap(x => x.sectors))];
  S.highlight = hit[0].code; S.view = "stocks";
  if (!S.filter || !secs.includes(S.filter)) S.filter = secs[0];   // 已在該股所屬族群內就維持不變
  S.scrollToHit = true; render();
}
$("q").addEventListener("input", e => goStock(e.target.value, false));
$("q").addEventListener("change", e => goStock(e.target.value, true));
$("q").addEventListener("keydown", e => { if (e.key === "Enter") { goStock(e.target.value, true); e.target.blur(); } });

$("chartSel").innerHTML = Object.entries(CHART_SITES).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join("");
$("chartSel").value = S.chartSite;
$("chartSel").onchange = e => {
  S.chartSite = e.target.value;
  try { localStorage.setItem("chartSite", S.chartSite); } catch (err) {}
  renderStocks();
};

/* ===== 啟動：先嘗試預設網址，失敗則顯示示範資料 ===== */
(async () => {
  try {
    const rs = await Promise.allSettled(CONFIG.DEFAULT_URLS.map(u => fetchTexts([u]).then(a => a[0])));
    ingest(rs.filter(r => r.status === "fulfilled").map(r => r.value));
  }
  catch { S.data = { date: SAMPLE.date, stocks: SAMPLE.stocks, sectors: computeSectors(SAMPLE.stocks) }; S.sample = true; }
  render();
})();
</script>
</body>
</html>
